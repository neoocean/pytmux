name: benchmark

# OS별 성능/반응성 벤치마크(scripts/bench.py)를 ubuntu/macos/windows 에서 돌리고
# 결과(docs/internal/benchmark/<os>/<ts>.md|json)를 **아티팩트로만** 남긴다.
# 배경/한계: docs/internal/WINDOWS_TESTING.md, docs/internal/benchmark/README.md.
#
# ⚠ 종전에는 `publish` 잡이 그 결과를 미러에 커밋·푸시했다. §10-17 로 출력 경로가
# `docs/internal/` 아래(= .gitignore 가 디렉토리째 막는 곳)로 이사하면서 그 잡은
# **빈 커밋을 만들거나 죽는** 상태가 됐고, 목적지가 비공개인데 커밋할 이유도 없어졌다.
# 그래서 퇴역시켰다 — 재는 일은 그대로 두고 커밋·푸시만 뺀다.
#   · `permissions` 를 contents: read 로 낮췄다(더는 쓸 일이 없다 — 최소권한).
#   · `paths-ignore` 도 뺐다. 그건 "bench 커밋이 자신을 재트리거"하는 것을 막는
#     장치였는데 이제 bench 커밋 자체가 없다.
#   · 대가를 알고 고른 것이다: OS별 이력이 앞으로 git 에 안 쌓인다. 남는 것은
#     아티팩트(보존기간)와, 사람이 로컬에서 돌려 p4 에 넣는 것뿐이다.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"                   # 매주 월 06:17 UTC(코드 변경 없이도 env 드리프트 추적)

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run benchmark
        run: python scripts/bench.py --mb 8 --reps 200
      - name: Upload benchmark files
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: docs/internal/benchmark/
          if-no-files-found: error
