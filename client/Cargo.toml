# pytmux-gui — 워크스페이스 루트
#
# 이 파일은 pytmux 프로젝트가 직접 작성했다. warp 저장소의 루트 Cargo.toml(21K줄,
# AGPL)을 트리밍한 것이 아니라, warpui/warpui_core 가 실제로 요구하는 의존만 남겨
# 새로 구성한 것이다. 버전 제약값은 upstream 스냅샷(p4 67415)과의 호환을 위해
# 동일한 값을 쓴다(버전 번호는 사실 정보이지 표현이 아니다).
#
# 라이선스: 이 워크스페이스의 산출물은 MIT 다. 자세한 경위는 PROVENANCE.md 참조.

[workspace]
resolver = "2"
members = [
    "crates/warpui",
    "crates/warpui_core",
    # 아래는 AGPL 원본을 대체하는 자체 구현(MIT). PROVENANCE.md §2 참조.
    "crates/warp_errors",
    "crates/warp_util",
    "crates/string-offset",
    "crates/command",
    "crates/markdown_parser",
    "crates/sum_tree",
    # 클라이언트 본체. base 는 UI 의존이 없고, gui 가 뷰를 갖는다.
    #
    # ⚠ 2026-08-01: **Rust TUI 를 지웠다**(사용자 결정). 클라 제품은 정본 Textual TUI 와
    # 이 GUI 둘이다 — 같은 매체(터미널)에 제품이 두 벌일 이유가 없었고, 정본이 아닌 쪽을
    # 유지하는 값은 "파이썬이 없는 터미널 상자" 하나로 좁아져 있었다
    # (docs/internal/CLIENT_PRODUCT_SET_2026-08-01.md).
    "crates/claude",
    "crates/clip",
    "crates/base",
    "crates/proto",
    "crates/gui",
]

[workspace.package]
authors = ["pytmux contributors"]
publish = false
license = "MIT"

[workspace.dependencies]
# --- 자체 구현(AGPL 원본 대체) ---
warp_errors = { path = "crates/warp_errors" }
warp_util = { path = "crates/warp_util" }
string-offset = { path = "crates/string-offset" }
command = { path = "crates/command" }
markdown_parser = { path = "crates/markdown_parser" }
sum_tree = { path = "crates/sum_tree" }

# --- 클라이언트 ---
claude = { path = "crates/claude" }
clip = { path = "crates/clip" }
base = { path = "crates/base" }
proto = { path = "crates/proto" }

