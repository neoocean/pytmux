[package]
name = "gui"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true
description = "pytmux 네이티브 클라이언트 — GUI 이진."

[[bin]]
name = "pytmux-gui"
path = "src/main.rs"

[dependencies]
# Claude 트랜스크립트를 항목으로 읽는다(P5). TUI 와 **같은 크레이트**라 같은 대화가
# 두 클라에서 다르게 보이지 않는다.
claude.workspace = true
base.workspace = true
# `run-shell`·`if-shell` 이 외부 프로세스를 부른다 — 그 규칙은 이 크레이트 한 곳이다
# (클립보드 도구와 같은 자리).
clip.workspace = true
proto.workspace = true
# 네이티브 오버레이의 **상태**는 그 오버레이를 그리는 쪽이 모양을 정한다(설계 Tier D ·
# pytmux-458) — 프로토콜이 플러그인 이름도 필드도 모르므로 값이 `serde_json::Value` 다.
# 그것을 읽는 자리가 뷰라서 여기에 붙는다.
serde_json.workspace = true
warpui.workspace = true
# `--frame-dump` 하네스가 드로어블을 뜨는 자리(`request_frame_capture`)와 PNG 쓰기.
# 화면 캡처가 아니라 자가 덤프인 이유는 main.rs `take_frame_dump` 문서에 있다.
warpui_core.workspace = true
image.workspace = true
anyhow.workspace = true
# 어느 글꼴로 떴는지 남긴다 — 글자가 이상할 때 첫 단서다(`mono_font`).
log.workspace = true
# 그 진단이 **실제로 보이게** 하는 것. 로거가 없으면 log::info! 는 어디로도
# 안 가고, 그건 진단을 안 남긴 것과 같다(2026-07-28 실측: 67739 의 글꼴 줄이
# 그 상태였다).
env_logger.workspace = true

[dev-dependencies]
# 세션 뷰 테스트가 서버 메시지를 JSON 으로 합성한다(TUI 테스트와 같은 이유 —
# 와이어 모양 그대로 써야 필드 이름이 어긋나는 것까지 잡힌다).
serde_json.workspace = true
# ★ 엘리먼트가 **무슨 글자를 담고 있나**를 창 없이 묻는 길(`Element::debug_text_content`).
#   그 메서드는 `test-util` 뒤에 있어서, 안 켜면 "판에 이 글자가 떴나"를 재는 오라클을
#   아예 못 쓴다 — 이 크레이트의 오래된 약점이었다(*"화면에 무엇이 보이나는 사람이 본다"*).
#   상류 자신이 같은 방법을 쓴다(`warpui_core/Cargo.toml` 의 dev-dependency 자기 참조).
#   ⚠ **`warpui` 쪽을 켜야 한다**(`test-util = ["warpui_core/test-util"]` 로 번진다).
#   `warpui_core` 만 켜면 트레이트는 `get_cursor_shape` 를 요구하는데 그 구현은 warpui 의
#   같은 이름 기능 뒤에 있어서, 델리게이트 둘이 "구현이 빠졌다"로 컴파일이 죽는다.
warpui = { workspace = true, features = ["test-util"] }

# 입력기(IME) 배지는 **OS 에 물어봐야** 안다 — winit 이벤트로는 "조합 중"만 알 수 있고
# "지금 영문"은 못 만든다(`ime.rs` 문서). Windows 전용이라 여기서만 붙는다.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_Input_Ime",
  "Win32_UI_WindowsAndMessaging",
  # GUI 서브시스템 이진이 터미널에서 떴을 때 **부모 콘솔에 붙는다**(`console.rs`).
  # 이 둘이 없으면 `--help`·기동 실패 사유가 갈 곳이 없다.
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
] }